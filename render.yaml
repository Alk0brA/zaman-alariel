databases:
  - name: zaman-alariel-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: zaman_alariel_db
    user: zaman_alariel_db_user

services:
  - type: web
    name: zaman-alariel
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: zaman-alariel-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
